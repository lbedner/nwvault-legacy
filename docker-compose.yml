
x-app: &app
  image: ${AEGIS_STACK_TAG:-aegis-stack:latest}
  build:
    context: .
    args:
      - AEGIS_STACK_VERSION=${AEGIS_STACK_VERSION:-dev}
      - PORT=${PORT:-8000}
  env_file:
    - ${AEGIS_STACK_ENV_FILE:-.env}
  environment:
    # Docker container marker for entrypoint script
    - DOCKER_CONTAINER=1
    - PORT=${PORT:-8000}
  labels:
    logging: "aegis-stack"

services:
  # DEVELOPMENT PROFILE

  webserver:
    <<: *app
    command:
      - webserver
    volumes:
      - ./archive:/code/archive:ro
      - ./data:/code/data
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # Docker container marker
      - DOCKER_CONTAINER=1
      # Redis connection for health checks
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      # Logfire observability token
      - LOGFIRE_TOKEN=${LOGFIRE_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-8000}/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.5'
    labels:
      - "traefik.enable=true"
      # Public router
      - "traefik.http.routers.webserver.rule=PathPrefix(`/`)"
      - "traefik.http.routers.webserver.entrypoints=web"
      - "traefik.http.routers.webserver.middlewares=webserver-retry"
      - "traefik.http.services.webserver.loadbalancer.server.port=${PORT:-8000}"
      # Retry middleware — retries WebSocket upgrade during uvicorn hot-reload
      - "traefik.http.middlewares.webserver-retry.retry.attempts=5"
      - "traefik.http.middlewares.webserver-retry.retry.initialinterval=2s"
      # Admin paths - IP restricted (set ADMIN_IP_ALLOWLIST in .env)
      - "traefik.http.routers.webserver-admin.rule=PathPrefix(`/dashboard`) || PathPrefix(`/docs`) || PathPrefix(`/redoc`) || PathPrefix(`/openapi.json`)"
      - "traefik.http.routers.webserver-admin.entrypoints=web"
      - "traefik.http.routers.webserver-admin.service=webserver"
      - "traefik.http.routers.webserver-admin.middlewares=admin-ipallowlist,webserver-retry"
      - "traefik.http.middlewares.admin-ipallowlist.ipallowlist.sourcerange=${ADMIN_IP_ALLOWLIST:-0.0.0.0/0}"
    profiles:
      - dev
      - prod
  # Load Test Worker (high-performance load testing tasks)
  worker-load-test:
    <<: *app
    command:
      - worker
      - load_test
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    tty: true
    environment:
      # Docker container marker for entrypoint script
      - DOCKER_CONTAINER=1
      # Load test worker configuration
      - WORKER_QUEUE_TYPE=load_test
      - WORKER_TIMEOUT_SECONDS=${LOAD_TEST_WORKER_TIMEOUT:-60}
      - WORKER_MAX_TRIES=${LOAD_TEST_WORKER_MAX_TRIES:-1}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    profiles:
      - dev
      - prod


  # Vault Download Worker (fetch files from RoloVault archive)
  worker-vault-download:
    <<: *app
    command:
      - worker
      - vault_download
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    tty: true
    environment:
      - DOCKER_CONTAINER=1
      - WORKER_QUEUE_TYPE=vault_download
      - WORKER_TIMEOUT_SECONDS=3600
      - WORKER_MAX_TRIES=3
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    profiles:
      - dev
      - prod

  # Vault Import Worker (XML parsing and DB import)
  worker-vault-import:
    <<: *app
    command:
      - worker
      - vault_import
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    tty: true
    environment:
      - DOCKER_CONTAINER=1
      - WORKER_QUEUE_TYPE=vault_import
      - WORKER_TIMEOUT_SECONDS=600
      - WORKER_MAX_TRIES=3
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    profiles:
      - dev
      - prod

  # Vault Fix Worker (HTML asset URL rewriting)
  worker-vault-fix:
    <<: *app
    command:
      - worker
      - vault_fix
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    tty: true
    environment:
      - DOCKER_CONTAINER=1
      - WORKER_QUEUE_TYPE=vault_fix
      - WORKER_TIMEOUT_SECONDS=300
      - WORKER_MAX_TRIES=3
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    profiles:
      - dev
      - prod

  # System Worker (maintenance and administrative tasks)
  worker-system:
    <<: *app
    command:
      - worker
      - system
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    tty: true
    environment:
      # Docker container marker for entrypoint script
      - DOCKER_CONTAINER=1
      # System worker configuration (high reliability)
      - WORKER_QUEUE_TYPE=system
      - WORKER_TIMEOUT_SECONDS=${SYSTEM_WORKER_TIMEOUT:-1800}
      - WORKER_MAX_TRIES=${SYSTEM_WORKER_MAX_TRIES:-5}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    profiles:
      - dev
      - prod
  # REDIS SERVICE

  redis:
    image: redis:7-alpine
    hostname: redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    profiles:
      - dev
      - prod
  # TRAEFIK REVERSE PROXY

  traefik:
    image: traefik:v3.6
    hostname: traefik
    environment:
      - DOCKER_API_VERSION=1.44
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    profiles:
      - dev
      - prod

  # TEST PROFILE

  test_runner:
    <<: *app
    command:
      - test
    env_file:
      - ${AEGIS_STACK_ENV_FILE:-.env}
    profiles:
      - test

volumes:
  aegis-data: